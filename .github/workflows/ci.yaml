name: '  ▶️  CI Workflow'

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - '.vscode/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: pull-${{ github.ref }}-1
  cancel-in-progress: true

env:
  CI: 'true'

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      matrix:
        os: [ubuntu-latest]

    name: 'Build: ${{ matrix.os }}'

    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: '🧰 Setup (mise)'
        uses: ./.github/actions/setup-mise

      - name: '🔎 Typecheck'
        run: pnpm typecheck

      - name: '🔍 Check exports'
        run: pnpm check:exports

      - name: '🏗️ Build'
        run: pnpm build

      - name: '🚨 Lint code'
        run: pnpm lint:ci

      - name: '🧳 Run tests'
        run: pnpm test

      # Chrome is preinstalled on GitHub's ubuntu runners; pin the path for
      # the WebView chrome backend. One retry absorbs CDN hiccups (esm.sh).
      # Addressed by path (not `pnpm --filter runesm`) because a filter that
      # matches nothing exits 0 and would silently skip this gate.
      - name: '🌐 Run browser tests'
        run: |
          test -x "$BUN_CHROME_PATH" || {
            echo "::error::BUN_CHROME_PATH does not point at an executable: $BUN_CHROME_PATH"
            exit 1
          }
          pnpm -C packages/runesm run test:browser || {
            echo '::warning::browser tests failed on first attempt, retrying once'
            echo '### :warning: Browser tests flaked and needed a retry' >> "$GITHUB_STEP_SUMMARY"
            pnpm -C packages/runesm run test:browser
          }
        env:
          BUN_CHROME_PATH: /usr/bin/google-chrome-stable

      - name: '📏 Check size budget'
        run: pnpm -C packages/runesm run check:size

      - name: '📦 Check packed consumer'
        run: pnpm -C packages/runesm run test:pack

      - name: '📦 pkg.pr.new (preview release)'
        if: github.event_name == 'pull_request'
        run: pnpm exec pkg-pr-new publish './packages/runesm' --packageManager=pnpm
