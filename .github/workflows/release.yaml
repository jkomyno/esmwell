name: '  📦 Release'

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for npm trusted publishing (OIDC)

env:
  CI: 'true'

jobs:
  release:
    # Disabled until the first runesm package and trusted publisher exist.
    # Follow CONTRIBUTING.md, then remove only this guard.
    if: false
    name: Version & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Prepare git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: '🧰 Setup (mise)'
        uses: ./.github/actions/setup-mise

      - name: '📦 Create Release PR or Publish'
        id: changesets
        uses: changesets/action@e87c8ed249971350e47fab7515075f44eb134e5b # v1.7.0
        with:
          version: pnpm version-packages
          # pnpm release runs every local gate before changeset publish.
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
