<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>runesm playground</title>
    <script>
      window.addEventListener('error', (event) => {
        console.error('page error:', event.message, 'at', event.filename, event.lineno)
      })
      window.addEventListener('unhandledrejection', (event) => {
        console.error('unhandled rejection:', String(event.reason))
      })
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="masthead">
      <h1 class="wordmark">runesm <span class="wordmark-qualifier">playground</span></h1>
      <p class="claim">
        Edit the module, run it, or call it from the REPL. Bare imports resolve through
        <a href="https://esm.sh" rel="noreferrer">esm.sh</a>.
      </p>
    </header>

    <main class="bench">
      <div class="column">
        <section class="pane pane--grow" aria-labelledby="label-editor">
          <div class="pane-head">
            <h2 class="pane-label" id="label-editor">Editor</h2>
            <div class="editor-controls">
              <button
                id="source-reset"
                type="button"
                class="icon-button"
                aria-label="Clear changes and restore initial source"
                title="Clear changes and restore initial source"
                disabled
              >
                <span aria-hidden="true">↺</span>
              </button>
              <div class="language-switch" role="group" aria-label="Source language">
                <button type="button" class="language-option" data-language="ts" aria-pressed="true">.ts</button>
                <button type="button" class="language-option" data-language="mjs" aria-pressed="false">.mjs</button>
              </div>
            </div>
          </div>
          <p id="source-status" class="source-status" role="status" hidden></p>
          <div class="editor-stage">
            <div id="editor" class="editor-host"></div>
            <details class="test-drawer" id="test-drawer" open>
              <summary class="test-drawer-handle">
                <span class="test-drawer-caret" aria-hidden="true">›</span>
                <span>Test cases</span>
                <span class="test-drawer-count" id="test-count"></span>
              </summary>
              <ol id="test-definitions" class="test-definitions"></ol>
            </details>
          </div>
          <div class="editor-footer">
            <p class="pane-note editor-shortcuts" id="editor-shortcuts">⌘↵ run · Ctrl+Space complete · ⌘⇧H types</p>
            <p class="pane-note editor-cursor" id="editor-cursor" aria-live="off">Ln 1, Col 1</p>
          </div>
          <div class="run-bar">
            <button id="run" type="button" class="button button--secondary">Run script</button>
            <button id="judge" type="button" class="button button--primary">Run tests</button>
          </div>
        </section>
      </div>

      <div class="column column--response">
        <section class="pane" aria-labelledby="label-output">
          <div class="pane-head">
            <h2 class="pane-label" id="label-output">Output</h2>
            <p id="tape" class="tape" role="status"></p>
          </div>
          <div id="console" class="console well" role="log" aria-label="Console output"></div>
          <div id="results" class="results" role="status" aria-label="Run results">
            <p id="results-empty" class="well-empty"></p>
            <div id="fault" class="fault" hidden></div>
            <ul id="cases" class="cases"></ul>
          </div>
        </section>

        <section class="pane pane--grow" aria-labelledby="label-repl">
          <div class="pane-head">
            <h2 class="pane-label" id="label-repl">Repl</h2>
            <p class="pane-note" id="repl-shortcuts">→ accept suggestion · ↑↓ history · Ctrl+Space complete</p>
            <div class="actions">
              <button id="repl-reset" type="button" class="button button--secondary button--sm">Reset scope</button>
            </div>
          </div>
          <div id="repl-history" class="repl-history well" role="log" aria-label="REPL history"></div>
          <div class="repl-entry">
            <span class="repl-caret" aria-hidden="true">&rsaquo;</span>
            <div id="repl-input" class="repl-input"></div>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
